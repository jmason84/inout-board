<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IN/OUT Board</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="kiosk-body">
  <main class="kiosk">
    <div class="kiosk-clock" id="kioskClock"></div>
    <h1>IN / OUT</h1>
    <input type="search" id="kioskSearch" class="search big" placeholder="Type your name…" autocomplete="off" autocapitalize="words" autofocus />
    <div id="kioskResults" class="kiosk-results" aria-live="polite"></div>
    <p class="kiosk-foot"><a href="/me">My profile</a></p>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script src="/shared.js"></script>
  <script src="/kiosk.js"></script>
</body>
</html>
