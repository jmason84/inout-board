name: Windows installer

# Builds the MSI and the Setup EXE on a Windows runner, installs the MSI for
# real, checks the board answers over HTTPS, upgrades it, uninstalls it, and
# only then publishes the files as a build artifact (and on a v* tag, as a
# GitHub release).

on:
  push:
    branches: ['codex/**', main, deploy]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts with Windows PowerShell 5.1
        shell: powershell
        run: ./test/windows-syntax.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test on Windows
        run: npm test

  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: test-windows
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Match published release and installed versions
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Windows releases require a vMAJOR.MINOR.PATCH tag' }
            "VERSION=$($Matches[1])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
          wix --version

      - name: Build MSI and Setup EXE
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./windows/build.ps1 -Version $env:VERSION

      - name: Install the MSI silently
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 80; throw "msiexec exit $($p.ExitCode)" }

      - name: Check the installed board
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramData 'InOutBoard'
          'tasks:'; Get-ScheduledTask -TaskName 'IN-OUT Board*' | Format-Table TaskName, State
          if ((Get-ScheduledTask -TaskName 'IN-OUT Board*').Count -ne 2) { throw 'expected 2 scheduled tasks (board + nightly backup)' }
          if (-not (Get-NetFirewallRule -DisplayName 'IN/OUT Board HTTPS' -ErrorAction SilentlyContinue)) { throw 'firewall rule missing' }
          foreach ($f in 'inout-board.env','data\inout.sqlite','InOutBoard-Local-CA.crt') {
            if (-not (Test-Path (Join-Path $root $f))) { Get-ChildItem $root -Recurse | Select-Object FullName; Get-Content "$root\logs\*.log" -ErrorAction SilentlyContinue; throw "missing $f" }
          }
          # nothing but the board itself is installed: no separate proxy program, no private second port
          if (Test-Path "$env:ProgramFiles\IN-OUT Board\caddy.exe") { throw 'caddy.exe should no longer ship' }
          # HTTPS answers on the loopback and on this runner's LAN address
          $h = Invoke-RestMethod https://127.0.0.1:8443/api/health -SkipCertificateCheck
          if (-not $h.ok) { throw 'https health failed' }
          $lan = (& "$env:ProgramFiles\IN-OUT Board\node.exe" "$env:ProgramFiles\IN-OUT Board\scripts\netinfo.js" --plain) | Select-Object -First 1
          if ($lan) {
            $h = Invoke-RestMethod "https://${lan}:8443/api/health"
            if (-not $h.ok) { throw "https health failed (trusted, no bypass) on $lan" }
            "HTTPS OK and trusted on $lan"
          }
          # port 3000 is no longer used
          $old = $false
          try { Invoke-WebRequest http://127.0.0.1:3000/api/health -TimeoutSec 3 -UseBasicParsing | Out-Null; $old = $true } catch {}
          if ($old) { throw 'something still answers on the old internal port 3000' }
          # HTTPS is TRUSTED on this PC (no certificate bypass): the installer added the CA to the machine store
          $h = Invoke-RestMethod https://127.0.0.1:8443/api/health
          if (-not $h.ok) { throw 'https health failed WITHOUT skipping certificate checks: CA not trusted' }
          $h = Invoke-RestMethod https://localhost:8443/api/health
          if (-not $h.ok) { throw 'https://localhost not trusted' }
          $pkg = Get-Content "$env:ProgramFiles\IN-OUT Board\package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne $env:VERSION) { throw "installed version $($pkg.version) does not match $env:VERSION" }
          $ca = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 "$root\InOutBoard-Local-CA.crt"
          if (-not (Get-ChildItem Cert:\LocalMachine\Root | Where-Object Thumbprint -eq $ca.Thumbprint)) { throw 'CA not in LocalMachine Root store' }
          # other devices can download the CA over HTTPS
          $caFile = Join-Path $env:RUNNER_TEMP 'downloaded-ca.crt'
          $dl = Invoke-WebRequest https://127.0.0.1:8443/ca.crt -UseBasicParsing -OutFile $caFile -PassThru
          "ca.crt: HTTP $($dl.StatusCode), type $($dl.Headers['Content-Type']), $((Get-Item $caFile).Length) bytes"
          $caText = Get-Content $caFile -Raw
          if ($caText -notmatch 'BEGIN CERTIFICATE') { throw '/ca.crt did not return a certificate' }
          # and it is the public certificate only, never the key
          if ($caText -match 'PRIVATE KEY') { throw '/ca.crt leaked a private key' }
          # the published copy is the CA file the app keeps
          if ((Get-FileHash "$root\InOutBoard-Local-CA.crt").Hash -ne (Get-FileHash "$root\tls\ca.crt").Hash) { throw 'published CA differs from tls\ca.crt' }
          # it is the same CA the PC trusts
          $dlCert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 $caFile
          if ($dlCert.Thumbprint -ne $ca.Thumbprint) { throw 'downloaded CA differs from the trusted CA' }
          # firewall rule opens the TLS port by number on every profile
          $rule = Get-NetFirewallRule -DisplayName 'IN/OUT Board HTTPS'
          $pf = $rule | Get-NetFirewallPortFilter
          if ($pf.LocalPort -ne '8443' -or $pf.Protocol -ne 'TCP' -or $rule.Profile -ne 'Any' -or $rule.Enabled -ne 'True') { throw "firewall rule wrong: $($rule.Profile) $($pf.LocalPort) $($rule.Enabled)" }
          # first sign-in is admin/admin and forces a new password
          $login = Invoke-RestMethod https://127.0.0.1:8443/api/auth/login -Method Post -ContentType 'application/json' -Body (@{ username='admin'; password='admin' } | ConvertTo-Json) -SessionVariable sess
          if (-not $login.must_change) { throw 'admin/admin did not require a password change' }
          try { Invoke-RestMethod https://127.0.0.1:8443/api/tenants -WebSession $sess | Out-Null; throw 'API reachable before password change' } catch { if ($_.Exception.Message -eq 'API reachable before password change') { throw } }
          # Set a non-default password so repair/upgrade must preserve real credentials.
          $password = 'installer-regression-password'
          Invoke-RestMethod https://127.0.0.1:8443/api/auth/password -Method Post -ContentType 'application/json' -WebSession $sess -Body (@{ current='admin'; next=$password } | ConvertTo-Json)
          & "$env:ProgramFiles\IN-OUT Board\InOutBoard.ps1" -Action Status

      - name: Repair preserves the admin password
        timeout-minutes: 5
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/fa `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\repair.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\repair.log" -Tail 80; throw "repair exit $($p.ExitCode)" }
          $login = Invoke-RestMethod https://127.0.0.1:8443/api/auth/login -Method Post -ContentType 'application/json' -Body (@{ username='admin'; password='installer-regression-password' } | ConvertTo-Json)
          if ($login.must_change) { throw 'repair reset the existing password' }

      - name: Duplicate supervisors cannot take over the running board
        shell: pwsh
        run: |
          $script = "$env:ProgramFiles\IN-OUT Board\InOutBoard.ps1"
          $ps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $p = Start-Process $ps -ArgumentList "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$script`" -Action RunApp" -PassThru
          if (-not $p.WaitForExit(10000)) { Stop-Process -Id $p.Id -Force; throw 'duplicate supervisor did not stop' }
          if ($p.ExitCode -eq 0) { throw 'duplicate supervisor was not rejected' }
          if (-not (Invoke-RestMethod https://127.0.0.1:8443/api/health).ok) { throw 'duplicate supervisor interrupted the board' }

      - name: Backup now
        shell: pwsh
        run: |
          & "$env:ProgramFiles\IN-OUT Board\InOutBoard.ps1" -Action Backup
          if (-not (Get-ChildItem "$env:ProgramData\InOutBoard\backups\inout-*\inout.sqlite")) { throw 'no backup produced' }

      - name: Verified update worker installs a newer MSI and preserves credentials
        timeout-minutes: 5
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramData 'InOutBoard'
          $installDir = Join-Path $env:ProgramFiles 'IN-OUT Board'
          $parts = $env:VERSION.Split('.')
          $newVersion = '{0}.{1}.{2}' -f $parts[0], $parts[1], ([int]$parts[2] + 1)
          New-Item -ItemType Directory -Force update-test, "$root\updates" | Out-Null
          $pkgPath = "$PWD\build\windows\stage\package.json"
          $oldPkg = Get-Content $pkgPath -Raw
          try {
            $pkg = $oldPkg | ConvertFrom-Json
            $pkg.version = $newVersion
            [IO.File]::WriteAllText($pkgPath, ($pkg | ConvertTo-Json), (New-Object Text.UTF8Encoding($false)))
            wix build windows/Package.wxs -arch x64 -d "Version=$newVersion" -d "StageDir=$PWD\build\windows\stage" -o "update-test\InOutBoard-$newVersion-x64.msi"
            if ($LASTEXITCODE -ne 0) { throw 'update fixture build failed' }
          } finally { [IO.File]::WriteAllText($pkgPath, $oldPkg, (New-Object Text.UTF8Encoding($false))) }
          $msi = (Get-ChildItem update-test/*.msi).FullName
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash
          $worker = "$root\updates\test-update.ps1"
          Copy-Item "$installDir\windows-update.ps1" $worker
          $ps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          # A checksum mismatch must leave the installed board online.
          $wrong = '0' * 64
          $args = "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$worker`" -MsiPath `"$msi`" -ExpectedHash $wrong -Version $newVersion -DataRoot `"$root`" -InstallDir `"$installDir`""
          $p = Start-Process $ps -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -eq 0) { throw 'corrupt installer was accepted' }
          if (-not (Invoke-RestMethod https://127.0.0.1:8443/api/health).ok) { throw 'failed verification interrupted the board' }
          $args = $args.Replace($wrong, $hash)
          $p = Start-Process $ps -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$root\updates\status.json"; Get-Content "$root\updates\installer.log" -Tail 100; throw 'update worker failed' }
          $status = Get-Content "$root\updates\status.json" -Raw | ConvertFrom-Json
          if ($status.state -ne 'complete') { throw 'update did not complete' }
          if ((Get-Content "$installDir\package.json" -Raw | ConvertFrom-Json).version -ne $newVersion) { throw 'installed version did not change' }
          if (-not (Get-ChildItem "$root\updates\configuration-*\inout-board.env")) { throw 'configuration backup missing' }
          $login = Invoke-RestMethod https://127.0.0.1:8443/api/auth/login -Method Post -ContentType 'application/json' -Body (@{ username='admin'; password='installer-regression-password' } | ConvertTo-Json) -SessionVariable updateSession
          if ($login.must_change) { throw 'update reset the password' }
          $state = Invoke-RestMethod https://127.0.0.1:8443/api/admin/update-status -WebSession $updateSession
          if (-not $state.supported -or $state.busy -or $state.state -ne 'complete') { throw 'update API status is incorrect' }

      - name: Real upgrade (newer MSI over the installed one) keeps data and settings
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramData 'InOutBoard'
          Add-Content "$root\inout-board.env" "`n# survived-upgrade-marker"
          # Same staged files, newer version number: exercises the MajorUpgrade path.
          $parts = $env:VERSION.Split('.')
          $newer = '{0}.{1}.{2}' -f $parts[0], $parts[1], ([int]$parts[2] + 2)
          New-Item -ItemType Directory -Force upgrade | Out-Null
          wix build windows/Package.wxs -arch x64 -d "Version=$newer" -d "StageDir=$PWD\build\windows\stage" -o "upgrade\InOutBoard-$newer-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw 'could not build upgrade MSI' }
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$PWD\upgrade\InOutBoard-$newer-x64.msi`" /qn /l*v `"$env:RUNNER_TEMP\upgrade.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\upgrade.log" -Tail 80; throw "upgrade exit $($p.ExitCode)" }
          if (-not (Select-String -Path "$root\inout-board.env" -Pattern 'survived-upgrade-marker' -Quiet)) { throw 'settings lost on upgrade' }
          if (-not (Test-Path "$root\data\inout.sqlite")) { throw 'database lost on upgrade' }
          if ((Get-ScheduledTask -TaskName 'IN-OUT Board*').Count -ne 2) { throw 'tasks missing after upgrade' }
          Start-Sleep -Seconds 5
          $h = Invoke-RestMethod https://127.0.0.1:8443/api/health -SkipCertificateCheck
          if (-not $h.ok) { throw 'board not healthy after upgrade' }
          $login = Invoke-RestMethod https://127.0.0.1:8443/api/auth/login -Method Post -ContentType 'application/json' -Body (@{ username='admin'; password='installer-regression-password' } | ConvertTo-Json)
          if ($login.must_change) { throw 'upgrade reset the existing password' }

      - name: Uninstall keeps data, removes tasks and firewall rule
        shell: pwsh
        run: |
          $msi = (Get-ChildItem upgrade/*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\uninstall.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\uninstall.log" -Tail 80; throw "uninstall exit $($p.ExitCode)" }
          if (Get-ScheduledTask -TaskName 'IN-OUT Board*' -ErrorAction SilentlyContinue) { throw 'tasks left behind' }
          if (Get-NetFirewallRule -DisplayName 'IN/OUT Board HTTPS' -ErrorAction SilentlyContinue) { throw 'firewall rule left behind' }
          if (Test-Path "$env:ProgramFiles\IN-OUT Board\server.js") { throw 'program files left behind' }
          if (Get-NetTCPConnection -LocalPort 8443 -State Listen -ErrorAction SilentlyContinue) { throw 'port 8443 is still listening after uninstall' }
          Start-Sleep -Seconds 6
          if (Get-NetTCPConnection -LocalPort 8443 -State Listen -ErrorAction SilentlyContinue) { throw 'a supervisor reopened port 8443 after uninstall' }
          if (-not (Test-Path "$env:ProgramData\InOutBoard\data\inout.sqlite")) { throw 'data was deleted' }
          $ca = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 "$env:ProgramData\InOutBoard\InOutBoard-Local-CA.crt"
          if (Get-ChildItem Cert:\LocalMachine\Root | Where-Object Thumbprint -eq $ca.Thumbprint) { throw 'CA still trusted after uninstall' }

      - name: Upgrade from the Caddy-based layout keeps the same CA and the same port
        shell: pwsh
        run: |
          # Recreate what an older install left behind: its CA under caddy\..., an env file with the proxy settings.
          $root = Join-Path $env:ProgramData 'InOutBoard'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          $legacy = Join-Path $root 'caddy\caddy\pki\authorities\local'
          New-Item -ItemType Directory -Force $legacy, "$root\data" | Out-Null
          & build/windows/stage/node.exe -e "const t=require('./scripts/tlscert'),fs=require('fs');const c=t.createCa('Caddy Local Authority - legacy');fs.writeFileSync(process.argv[1]+'/root.crt',c.certPem);fs.writeFileSync(process.argv[1]+'/root.key',c.keyPem)" $legacy
          $oldCa = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 "$legacy\root.crt"
          @"
          HOST=127.0.0.1
          PORT=3000
          DATA_DIR=$root\data
          TRUST_PROXY=1
          COOKIE_SECURE=1
          TLS_PORT=8443
          PUBLIC_SCHEME=https
          PUBLIC_PORT=8443
          EXTRA_ADDRESSES=
          PREFERRED_ADDRESS=
          ADMIN_USER=admin
          ADMIN_PASSWORD=
          "@ -replace '(?m)^\s+', '' | Set-Content "$root\inout-board.env" -Encoding ASCII
          $msi = (Get-ChildItem dist/*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\legacy.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\legacy.log" -Tail 80; throw "msiexec exit $($p.ExitCode)" }
          Start-Sleep -Seconds 5
          $envText = Get-Content "$root\inout-board.env" -Raw
          foreach ($want in 'HTTPS=auto', 'PORT=8443', 'HOST=0.0.0.0') { if ($envText -notmatch "(?m)^$want\s*$") { throw "env not converted: missing $want`n$envText" } }
          foreach ($gone in 'TRUST_PROXY', 'TLS_PORT', 'PUBLIC_SCHEME') { if ($envText -match "(?m)^$gone=") { throw "env still has $gone" } }
          if (-not (Test-Path "$root\inout-board.env.before-https-builtin")) { throw 'no backup of the old settings' }
          $h = Invoke-RestMethod https://127.0.0.1:8443/api/health
          if (-not $h.ok) { throw 'not healthy / not trusted after conversion' }
          $now = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 "$root\InOutBoard-Local-CA.crt"
          if ($now.Thumbprint -ne $oldCa.Thumbprint) { throw 'CA changed: devices that trusted the old one would have to re-install' }
          # the server certificate presented on the wire chains to that same old CA
          $login = Invoke-RestMethod https://127.0.0.1:8443/api/auth/login -Method Post -ContentType 'application/json' -Body (@{ username='admin'; password='admin' } | ConvertTo-Json)
          if (-not $login.must_change) { throw 'blank ADMIN_PASSWORD on a new database did not give admin/admin' }
          if ((Get-ScheduledTask -TaskName 'IN-OUT Board*').Count -ne 2) { throw 'expected 2 tasks after conversion' }
          if (Get-ScheduledTask -TaskName 'IN-OUT Board HTTPS' -ErrorAction SilentlyContinue) { throw 'old HTTPS task left behind' }
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall exit $($p.ExitCode)" }
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue

      - name: Size report
        shell: pwsh
        run: |
          $rows = Get-ChildItem dist -File | ForEach-Object { '| {0} | {1:N1} MB |' -f $_.Name, ($_.Length / 1MB) }
          $payload = (Get-ChildItem build/windows/stage -Recurse -File | Measure-Object Length -Sum).Sum
          $md = @('### Installer sizes', '', '| File | Size |', '|---|---|') + $rows + @('', ('Installed program files (uncompressed): {0:N1} MB' -f ($payload / 1MB)), ('Bundled Node: {0:N1} MB' -f ((Get-Item build/windows/stage/node.exe).Length / 1MB)))
          $md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $md

      - name: Setup EXE installs silently
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist/*.exe).FullName
          $p = Start-Process $exe -ArgumentList '/quiet /norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "setup exe exit $($p.ExitCode)" }
          $h = Invoke-RestMethod https://127.0.0.1:8443/api/health -SkipCertificateCheck
          if (-not $h.ok) { throw 'board not healthy after EXE install' }
          $p = Start-Process $exe -ArgumentList '/uninstall /quiet /norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "setup exe uninstall exit $($p.ExitCode)" }
          Start-Sleep -Seconds 6
          if (Get-NetTCPConnection -LocalPort 8443 -State Listen -ErrorAction SilentlyContinue) { throw 'EXE uninstall left the port in use' }

      - name: Explicit purge removes all data and supports a fresh reinstall
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramData 'InOutBoard'
          $msi = (Get-ChildItem dist/*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "purge fixture install exit $($p.ExitCode)" }
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" PURGEDATA=1 /qn /l*v `"$env:RUNNER_TEMP\purge.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\purge.log" -Tail 80; throw "purge exit $($p.ExitCode)" }
          if (Test-Path $root) { throw 'purge left behind or recreated ProgramData' }
          if (Get-ScheduledTask -TaskName 'IN-OUT Board*' -ErrorAction SilentlyContinue) { throw 'purge left tasks behind' }
          if (Get-NetFirewallRule -DisplayName 'IN/OUT Board HTTPS' -ErrorAction SilentlyContinue) { throw 'purge left firewall rule behind' }
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "fresh reinstall exit $($p.ExitCode)" }
          $login = Invoke-RestMethod https://127.0.0.1:8443/api/auth/login -Method Post -ContentType 'application/json' -Body (@{ username='admin'; password='admin' } | ConvertTo-Json)
          if (-not $login.must_change) { throw 'fresh reinstall did not require password change' }
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" PURGEDATA=1 /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path $root)) { throw 'final purge failed' }

      - name: Collect installer logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer-logs | Out-Null
          Copy-Item "$env:RUNNER_TEMP\*.log" installer-logs -ErrorAction SilentlyContinue
          Copy-Item "$env:ProgramData\InOutBoard\logs\*.log" installer-logs -ErrorAction SilentlyContinue

      - name: Keep installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-logs
          path: installer-logs
          if-no-files-found: ignore

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: InOutBoard-msi-${{ env.VERSION }}
          path: dist/*.msi

      - name: Upload Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: InOutBoard-setup-exe-${{ env.VERSION }}
          path: dist/*.exe

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: InOutBoard-checksums-${{ env.VERSION }}
          path: dist/SHA256SUMS.txt

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
