name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check server.js
          for f in public/*.js scripts/*.js test/*.js; do node --check "$f"; done
      - name: Smoke test
        run: npm test
